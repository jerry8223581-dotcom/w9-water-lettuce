<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR觀察站｜大萍探索教室</title><link rel="stylesheet" href="./css/style.css"><script type="module" src="./js/ar.js"></script></head><body><header class="site-header"><a class="brand" href="./index.html">❋ 大萍探索教室</a><nav><a href="./index.html#explore">回到3D探索</a></nav></header><main class="simple-page"><p class="eyebrow">AR FIELD STATION</p><h1>把大萍帶到眼前</h1><section class="simple-card"><h2>先準備老師的觀察卡</h2><ol><li>按下「開啟相機」，允許網站使用相機。</li><li>把相機對準整張大萍AR觀察卡，保持明亮、不反光。</li><li>看到模型後，慢慢移動，從不同方向觀察。</li></ol><p>相機只用來找觀察卡，網站不會錄影或上傳相機畫面。</p><p id="ar-status" class="notice camera-message" role="status">正在檢查AR設定……</p><div class="actions ar-overlay"><button id="ar-start" class="button" disabled>開啟相機</button><button id="ar-stop" class="button ghost" hidden>關閉 AR 與相機</button><a class="button secondary" href="./index.html#explore">改用一般3D觀察</a></div></section><div id="ar-stage" class="ar-stage" hidden></div><p class="small">AR需使用HTTPS或本機localhost，並由支援相機的瀏覽器開啟。行動裝置的相機辨識仍需實機驗證。</p></main><footer><a href="./teacher.html">教師設定與辨識圖</a><span>不支援AR也可以完成同樣的觀察任務。</span></footer></body></html>
